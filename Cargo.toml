[package]
name = "eoka"
version = "0.3.15"
edition = "2021"
license = "MIT"
description = "Stealth browser automation for Rust. Puppeteer/Playwright alternative with anti-bot bypass."
keywords = ["puppeteer", "playwright", "headless", "selenium", "web-scraping"]
categories = ["web-programming", "development-tools::testing", "api-bindings"]
repository = "https://github.com/cbxss/eoka"
homepage = "https://github.com/cbxss/eoka"
documentation = "https://docs.rs/eoka"
readme = "README.md"
authors = ["cbxss"]

[dependencies]
# Async runtime (minimal features — no net/io-util/macros/rt-multi-thread)
tokio = { version = "1", features = ["process", "sync", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Binary patching
aho-corasick = "1"
memmap2 = "0.9"

# RNG (zero transitive deps)
fastrand = "2"

# Base64 for screenshots
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "detection_test"
path = "examples/detection_test.rs"

[[example]]
name = "rebrowser_test"
path = "examples/rebrowser_test.rs"

[[example]]
name = "request_capture"
path = "examples/request_capture.rs"

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[[example]]
name = "connect_existing"
path = "examples/connect_existing.rs"
